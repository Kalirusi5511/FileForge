<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Feedback</title>
</head>

<body>

<h1>Feedback</h1>

<form
    action="/send-feedback"
    method="POST"
>

    <input
        type="text"
        name="name"
        placeholder="Name"
        required
    >

    <br>
    <br>

    <input
        type="email"
        name="email"
        placeholder="E-Mail"
        required
    >

    <br>
    <br>

    <textarea
        name="message"
        placeholder="Nachricht"
        rows="8"
        required
    ></textarea>

    <br>
    <br>

    <button type="submit">
        Senden
    </button>

</form>

</body>
</html>
